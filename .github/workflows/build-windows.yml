name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pipx install uv
      - name: Install deps (${{ matrix.edition }})
        shell: bash
        run: |
          if [ "${{ matrix.edition }}" = "cpu" ]; then export UV_TORCH_BACKEND=cpu; fi
          uv sync --extra analysis --extra llm --extra gui
          uv pip install pyinstaller
          uv pip uninstall typing || true   # obsolete backport (transitive); PyInstaller refuses to run with it
      - name: Fetch ffmpeg (gyan.dev release essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Copy-Item fftmp/*/bin/ffmpeg.exe,fftmp/*/bin/ffprobe.exe packaging/ffmpeg/
      - name: Build bundle
        shell: bash
        run: |
          export RAE_VERSION="${GITHUB_REF_NAME#v}"
          uv run pyinstaller packaging/rae.spec --noconfirm
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:RAE_VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          if (-not $env:RAE_VERSION) { $env:RAE_VERSION = "0.0.0-dev" }
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" /DEdition=${{ matrix.edition }} packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.edition }}
          path: packaging/Output/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe
