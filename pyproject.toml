[project]
name = "reaction-autoedit"
version = "0.1.0"
description = "Turn a full-length movie-reaction composite recording into an abridged, chronological YouTube cut."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "rich>=13.7",
]

[project.optional-dependencies]
# Stage 2 analysis stack (heavy; CPU-capable, GPU used automatically if torch sees CUDA)
analysis = [
    "faster-whisper>=1.0",
    "resemblyzer>=0.1.3",
    "librosa>=0.10",
    "scenedetect[opencv]>=0.6.4",
    "setuptools>=68,<82",  # webrtcvad (via resemblyzer) imports pkg_resources, removed in setuptools 82
    "speechbrain>=1.0",
    "torchaudio>=2.11.0",
    "panns-inference>=0.1.1",
]
# Optional LLM narrative-spine pass (Stage 3)
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
rae = "reaction_autoedit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaction_autoedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
